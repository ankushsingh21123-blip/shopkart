<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopKart — Modern Full-Stack E-Commerce Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // If opened via root static server, forward to frontend
    if (window.location.pathname === '/' && !window.location.port.includes('5173')) {
      setTimeout(() => {
        if (window.location.pathname === '/') {
          window.location.href = '/frontend/';
        }
      }, 500);
    }
  </script>
  <style>
    body {
      margin: 0;
      background: #0a0d14;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
      background-image: radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 90% 80%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
    }
    .card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 500px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
    <h1>ShopKart Platform</h1>
    <p>Modern Full-Stack MERN E-Commerce Web Application (Labs 01 to 06)</p>
    <a href="/frontend/" class="btn">Launch ShopKart Store</a>
  </div>
</body>
</html>
